<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#071527"/>
    </linearGradient>
    <linearGradient id="cyanGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Arka Plan Yuvarlatılmış Kart -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="#00f2fe" stroke-width="6"/>

  <!-- Dış Ağ/Dünya Çemberi (Localhost Simgesi) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGreen)" stroke-width="12" stroke-dasharray="20 10"/>

  <!-- Sunucu Katmanı 1 (Mavi) -->
  <rect x="126" y="160" width="260" height="70" rx="16" fill="#111827" stroke="#00f2fe" stroke-width="5"/>
  <circle cx="166" cy="195" r="10" fill="#10b981"/>
  <circle cx="196" cy="195" r="10" fill="#00f2fe"/>
  <line x1="240" y1="195" x2="350" y2="195" stroke="#374151" stroke-width="8" stroke-linecap="round"/>

  <!-- Sunucu Katmanı 2 (Yeşil) -->
  <rect x="126" y="282" width="260" height="70" rx="16" fill="#111827" stroke="#10b981" stroke-width="5"/>
  <circle cx="166" cy="317" r="10" fill="#10b981"/>
  <circle cx="196" cy="317" r="10" fill="#38bdf8"/>
  <line x1="240" y1="317" x2="350" y2="317" stroke="#374151" stroke-width="8" stroke-linecap="round"/>

  <!-- Orta Bağlantı Düğümü -->
  <circle cx="256" cy="256" r="22" fill="#10b981" stroke="#071527" stroke-width="4"/>
</svg>
